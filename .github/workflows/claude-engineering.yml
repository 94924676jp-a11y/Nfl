name: claude-engineering

# THE ENGINEERING WORKER, over the official Claude Code Action.
#
# The engineering transport is no longer a raw Anthropic API call billed per
# token. It is `anthropics/claude-code-action@v1` authenticated with
# CLAUDE_CODE_OAUTH_TOKEN, which is subscription-backed. ANTHROPIC_API_KEY is
# NOT required and is deliberately not passed: a silent fallback to it would
# move spending from a subscription to metered billing with nobody deciding.
#
# WHAT THIS WORKFLOW IS TRUSTED TO DECIDE: nothing.
#
# Its inputs are identifiers -- which task, which branch, which head. Whether
# that task is authorized, whether it is the one canonical state selects,
# whether the policy permits a pass at all, and whether LIVE is allowed, are
# all re-derived from COMMITTED STATE by
# `coordination/orchestrator/validate_engineering_run.py`. An input that
# disagrees with committed state loses. Otherwise anyone who can start this
# workflow picks what the engineering worker does, and the queue is
# decoration.
#
# IF VALIDATION REFUSES, CLAUDE NEVER RUNS. The Action step is guarded on the
# validator's own output, not on a `continue-on-error` that a later step
# interprets generously.

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Engineering task id (must match what canonical state selects)'
        required: true
      branch:
        description: 'Automation branch'
        required: false
        default: 'claude/nfl-greenfield-architecture-stsxmk'
      expected_head:
        description: 'Head the orchestrator observed (refuses if it has moved)'
        required: false
        default: ''
      chain_id:
        description: 'Continuation chain id, for tracing only'
        required: false
        default: ''

concurrency:
  # ONE ENGINEERING WORKER. The queue's exclusive-ACTIVE lock is the real
  # control; this stops two runners racing to discover that.
  group: claude-engineering
  cancel-in-progress: false

permissions:
  # THE NARROWEST SET THAT STILL LETS THE GOVERNED TASK HAPPEN. The Action
  # defaults to wanting more; it is constrained here instead. No `issues`, no
  # `pull-requests`: this worker commits to one branch and writes a return, it
  # does not open or comment on anything.
  contents: write

jobs:
  engineer:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Validate the requested branch against the allowlist
        id: target
        env:
          REQUESTED: ${{ github.event.inputs.branch }}
        run: |
          set -euo pipefail
          ALLOWED=( "claude/nfl-greenfield-architecture-stsxmk" )
          ok=0
          for b in "${ALLOWED[@]}"; do
            if [ "$REQUESTED" = "$b" ]; then ok=1; break; fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::BRANCH_NOT_ALLOWED: '$REQUESTED'"
            exit 1
          fi
          echo "branch=$REQUESTED" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.branch }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Identify the committer
        run: |
          git config user.name  "claude-engineering[bot]"
          git config user.email "claude-engineering@users.noreply.github.com"

      # ------------------------------------------------------------------
      # EVERYTHING THE RUN IS ALLOWED TO ASSUME IS ESTABLISHED HERE, from the
      # checked-out branch. If this step fails, no Claude step runs.
      - name: Pre-flight against committed state, and emit the packet
        id: preflight
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          AUTONOMY_MODE: LIVE
          # Presence only. The validator checks that it is set; it never reads
          # or prints the value.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          python3.12 coordination/orchestrator/validate_engineering_run.py \
            --task-id "${{ github.event.inputs.task_id }}" \
            --expected-head "${{ github.event.inputs.expected_head }}" \
            --emit-packet

      - name: Record the head the worker starts from
        id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The rendered packet becomes the Action's `prompt`. Loaded from the
      # file the pre-flight wrote, with a random delimiter so that nothing in
      # the packet can close the heredoc early and truncate the instructions
      # -- a prompt that ends halfway is a task with half its constraints.
      - name: Load the rendered packet as the prompt
        id: prompt
        env:
          TASK_ID: ${{ github.event.inputs.task_id }}
        run: |
          set -euo pipefail
          f="coordination/ENGINEERING_PACKETS/${TASK_ID}.prompt.md"
          test -s "$f" || { echo "::error::packet prompt absent at $f"; exit 1; }
          d="PKT_$(openssl rand -hex 12)"
          { echo "text<<$d"; cat "$f"; echo; echo "$d"; } >> "$GITHUB_OUTPUT"
          echo "loaded $(wc -c < "$f") bytes"

      # ------------------------------------------------------------------
      # THE WORKER. Reached only because every check above passed.
      - name: Claude Code — execute the authorized task
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The packet, rendered. Built from the committed queue record, never
          # from a workflow input.
          prompt: ${{ steps.prompt.outputs.text }}
          # --json-schema is what makes the result CHECKABLE rather than
          # something to be read hopefully: the Action then returns
          # `structured_output` carrying the fields the contract requires, and
          # a missing one is a malformed return instead of a judgement call.
          claude_args: |
            --max-turns 30
            --permission-mode acceptEdits
            --json-schema coordination/ENGINEERING_PACKETS/${{ github.event.inputs.task_id }}.schema.json

      # ------------------------------------------------------------------
      # THE RETURN IS INGESTED AND CHECKED. The Action's own conclusion is not
      # the verdict: a run can succeed while producing a malformed return, and
      # a malformed return must not advance a task.
      - name: Ingest, check and commit the governed return
        if: always() && steps.preflight.outcome == 'success'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          CLAUDE_CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          CLAUDE_SESSION_ID: ${{ steps.claude.outputs.session_id }}
          CLAUDE_STRUCTURED: ${{ steps.claude.outputs.structured_output }}
          HEAD_BEFORE: ${{ steps.before.outputs.sha }}
          TASK_ID: ${{ github.event.inputs.task_id }}
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set +e
          python3.12 coordination/orchestrator/ingest_engineering_return.py \
            --task-id "$TASK_ID" --head-before "$HEAD_BEFORE" \
            --branch "$BRANCH"
          rc=$?
          echo "INGEST_RC=$rc" >> "$GITHUB_ENV"
          # 0 return accepted and committed; 3 malformed/refused, recorded and
          # the task left where it was; 2 unreadable state.
          if [ $rc -eq 2 ]; then exit 1; fi
          exit 0

      - name: Summary
        if: always()
        run: |
          {
            echo "## claude-engineering"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| task | \`${{ github.event.inputs.task_id }}\` |"
            echo "| branch | \`${{ steps.target.outputs.branch }}\` |"
            echo "| pre-flight | \`${{ steps.preflight.outcome }}\` |"
            echo "| claude conclusion | \`${{ steps.claude.outputs.conclusion }}\` |"
            echo "| ingest | \`${INGEST_RC:-n/a}\` |"
            echo ""
            echo "The Action's conclusion is not the verdict. A return is"
            echo "accepted only if it parses, matches the packet, and judges"
            echo "every acceptance criterion. The owner reviewer, not this"
            echo "workflow, decides whether the task is COMPLETE."
          } >> "$GITHUB_STEP_SUMMARY"
