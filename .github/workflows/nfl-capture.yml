name: NFL vintage capture

# THE EXECUTOR FOR G0A ITEM 1.
#
# The perishable official cascade -- practice participation, final game status,
# inactives -- cannot be reconstructed after the fact. The archive keeps one row
# per player-week, the 2025 schema dropped its only timestamp, and every state
# that is not written down as it happens is gone.
#
# No executor available to the Claude session can retrieve it: DNS resolves and
# the local proxy answers 403 to CONNECT www.nfl.com:443. A GitHub-hosted runner
# can -- measured, run 34069329836: nfl.com/injuries 200 with 328,961 bytes and
# 35 status-word markers, nfl.com/inactives 200 with 417,665 bytes, no JS shell.
#
# CADENCE, AND WHAT IT DOES NOT BUY. Every 30 minutes.
#
# CORRECTION 2026-09-07. This comment used to argue that a 30-minute cadence
# "lands at least twice inside" the 80-minute inactives window and treat that as
# fulfilment of the T-90 obligation. That was a coverage-in-time argument doing
# duty as a discharge claim, and it is wrong twice over.
#
#   1. Landing inside game A's window is not attribution TO game A. This job
#      fetches league-wide pages and records no game_id, and
#      schedule._clears correctly refuses an unattributed capture for a
#      game-specific kind. Measured with nfl/capture/coverage.py: 16 week-1
#      inactives targets, 0 covered, 0 of 6 captures carrying a game_id.
#   2. The arithmetic assumes the cron fires. GitHub documents that scheduled
#      runs may be delayed or dropped under load. Measured base rate here:
#      n=3 scheduled runs, delays 14.8 / 5.5 / 6.7 minutes, actual gaps 20.7
#      and 31.2 minutes. n=3 supports no statement about drop probability.
#
# So this schedule guarantees only that the runner is awake often enough to have
# a chance of hitting the windows. It does NOT discharge a T-90 target, and the
# job now prints the game-anchored coverage answer alongside the source-level
# one so the two cannot be confused. Closing the gap needs an execution anchored
# on schedule.next_target and a capture row carrying the game_id it was taken
# for; that work is not done and is not claimed.
#
# It captures bytes and records what arrived. It does not parse, model, project
# or interpret, and it must not start.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # An append-only log tolerates a missed run far better than two runners
  # racing to push to the same branch.
  group: nfl-vintage-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # BELOW 3.12 THE ENGINE DOES NOT IMPORT, and two of the causes are at AST
      # level -- the module fails to parse before any import semantics or any
      # test can report on it. A runner silently downgraded by a setup-python
      # cache miss would produce a capture that failed for a reason nothing
      # here would name, so the interpreter is asserted rather than assumed.
      - name: Assert the interpreter is 3.12 or later
        run: |
          python3 -c "import sys; assert sys.version_info >= (3,12), 'INTERPRETER_TOO_OLD: ' + sys.version; print('interpreter', sys.version.split()[0])"

      # THE BEFORE-STATE FOR THE BLOB/MANIFEST INVARIANT. Taken before anything
      # is fetched, so the post-capture check compares two real observations
      # rather than the store against itself.
      - name: Snapshot the vintage store before capture
        run: |
          python3 nfl/tools/check_retention.py --store vintage --snapshot-to /tmp/pre

      - name: Capture
        id: capture
        run: |
          set +e
          python3 nfl/tools/capture_vintage.py --season 2026 | tee /tmp/capture.log
          # ${PIPESTATUS[0]}, NOT $?. After a pipe $? is TEE's status, which is
          # 0 whatever the capture did, so `exit=` recorded nothing about the
          # capture at all. The anchored workflow's comment has named this bug
          # since 2026-09-10; this file still had it.
          echo "capture_exit=${PIPESTATUS[0]}" | tee -a "$GITHUB_OUTPUT"

      # COMMIT BEFORE JUDGING. The FAIL gate used to run first, and because a
      # failing step skips the rest of the job, one source returning FAIL threw
      # away every other source's bytes for that run. Measured 2026-09-08: runs
      # 87 and 88 captured six sources successfully and committed none of them,
      # because official_inactives returned FAIL. Evidence already fetched is
      # evidence; a control failure must not destroy it. The run is still
      # marked failed below -- the signal is kept, the bytes are kept too.
      - name: Commit anything captured
        if: always()
        run: |
          git config user.name  "nfl-capture[bot]"
          git config user.email "nfl-capture@users.noreply.github.com"
          git add nfl/vintage nfl/vintage_manifest.jsonl
          if git diff --cached --quiet; then
            echo "nothing new captured; not committing"
            exit 0
          fi
          CID=$(grep -oE 'capture [0-9]{8}T[0-9]{6}Z' /tmp/capture.log | head -1 | awk '{print $2}')
          git commit \
            -m "NFL vintage capture ${CID:-unknown}" \
            -m "Captured by GitHub Actions run ${GITHUB_RUN_ID}." \
            -m "Append-only: adds manifest rows and content-addressed blobs, rewrites nothing."
          # Rebase rather than force: a concurrent run's rows are evidence too.
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      # Same gate as the anchored workflow: durable bytes with no manifest row
      # are orphans -- nothing attributes them to a game, a window or a basis,
      # so they discharge nothing. This workflow produced exactly that on
      # 2026-09-09/10: schedules blobs committed, manifest untouched, green.
      - name: Assert the capture produced a manifest row
        if: always()
        run: |
          if grep -q 'Traceback (most recent call last)' /tmp/capture.log; then
            echo "CAPTURE_RAISED: unhandled exception during capture"
            grep -A15 'Traceback (most recent call last)' /tmp/capture.log | tail -20
            exit 1
          fi
          if ! grep -qE '^manifest rows appended: [1-9]' /tmp/capture.log; then
            echo "CAPTURE_WROTE_NO_MANIFEST_ROW: nothing dischargeable recorded"
            tail -30 /tmp/capture.log
            exit 1
          fi
          grep -E '^manifest rows appended:' /tmp/capture.log

      # THE W3 GUARD, OFF THE LOG STRING AND ONTO THE FILESYSTEM.
      #
      # The step above greps stdout for `manifest rows appended: [1-9]`. The 50
      # runs that lost 2026-09-08/09/10 -- 48 orphan blobs, all of 2026-09-09
      # absent from the manifest including the four runs inside the NE@SEA
      # T-90 inactives window -- printed no summary line at all, which is
      # precisely the condition under which a stdout guard can see least. This
      # reads the blob set and the manifest before and after instead, and
      # refuses a run that added durable bytes without a row naming them.
      #
      # Runs AFTER the commit, like every other gate here: the bytes are kept
      # and the signal is kept.
      - name: Assert no blob was written without a manifest row
        if: always()
        run: |
          python3 nfl/tools/check_retention.py --store vintage --gate delta \
            --before-blobs /tmp/pre.blobs --before-manifest /tmp/pre.manifest

      - name: Fail the run only on a real FAIL
        if: always()
        run: |
          # DEFERRED (the source has not published yet) and BLOCKED (this
          # executor cannot reach it) are expected states, not run failures.
          # Only a FAIL means a control caught something wrong. This runs AFTER
          # the commit so a defect in one source cannot discard another's bytes.
          if grep -qE '^FAIL ' /tmp/capture.log; then
            echo "A source returned FAIL -- that is a real defect, not a state."
            grep -E '^FAIL ' /tmp/capture.log
            exit 1
          fi
          echo "no FAIL states"

      - name: Report the standing gap
        if: always()
        run: |
          grep -A3 'UNMET CAPTURE TARGETS' /tmp/capture.log || \
            echo "no unmet-target line -- check the capture output"
