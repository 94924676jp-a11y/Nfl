name: NFL vintage capture

# THE EXECUTOR FOR G0A ITEM 1.
#
# The perishable official cascade -- practice participation, final game status,
# inactives -- cannot be reconstructed after the fact. The archive keeps one row
# per player-week, the 2025 schema dropped its only timestamp, and every state
# that is not written down as it happens is gone.
#
# No executor available to the Claude session can retrieve it: DNS resolves and
# the local proxy answers 403 to CONNECT www.nfl.com:443. A GitHub-hosted runner
# can -- measured, run 34069329836: nfl.com/injuries 200 with 328,961 bytes and
# 35 status-word markers, nfl.com/inactives 200 with 417,665 bytes, no JS shell.
#
# CADENCE, AND WHAT IT DOES NOT BUY. Every 30 minutes.
#
# CORRECTION 2026-09-07. This comment used to argue that a 30-minute cadence
# "lands at least twice inside" the 80-minute inactives window and treat that as
# fulfilment of the T-90 obligation. That was a coverage-in-time argument doing
# duty as a discharge claim, and it is wrong twice over.
#
#   1. Landing inside game A's window is not attribution TO game A. This job
#      fetches league-wide pages and records no game_id, and
#      schedule._clears correctly refuses an unattributed capture for a
#      game-specific kind. Measured with nfl/capture/coverage.py: 16 week-1
#      inactives targets, 0 covered, 0 of 6 captures carrying a game_id.
#   2. The arithmetic assumes the cron fires. GitHub documents that scheduled
#      runs may be delayed or dropped under load. Measured base rate here:
#      n=3 scheduled runs, delays 14.8 / 5.5 / 6.7 minutes, actual gaps 20.7
#      and 31.2 minutes. n=3 supports no statement about drop probability.
#
# So this schedule guarantees only that the runner is awake often enough to have
# a chance of hitting the windows. It does NOT discharge a T-90 target, and the
# job now prints the game-anchored coverage answer alongside the source-level
# one so the two cannot be confused. Closing the gap needs an execution anchored
# on schedule.next_target and a capture row carrying the game_id it was taken
# for; that work is not done and is not claimed.
#
# It captures bytes and records what arrived. It does not parse, model, project
# or interpret, and it must not start.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # An append-only log tolerates a missed run far better than two runners
  # racing to push to the same branch.
  group: nfl-vintage-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Capture
        id: capture
        run: |
          set +e
          python3 nfl/tools/capture_vintage.py --season 2026 | tee /tmp/capture.log
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Fail the run only on a real FAIL
        run: |
          # DEFERRED (the source has not published yet) and BLOCKED (this
          # executor cannot reach it) are expected states, not run failures.
          # Only a FAIL means a control caught something wrong.
          if grep -qE '^FAIL ' /tmp/capture.log; then
            echo "A source returned FAIL -- that is a real defect, not a state."
            grep -E '^FAIL ' /tmp/capture.log
            exit 1
          fi
          echo "no FAIL states"

      - name: Commit anything captured
        run: |
          git config user.name  "nfl-capture[bot]"
          git config user.email "nfl-capture@users.noreply.github.com"
          git add nfl/vintage nfl/vintage_manifest.jsonl
          if git diff --cached --quiet; then
            echo "nothing new captured; not committing"
            exit 0
          fi
          CID=$(grep -oE 'capture [0-9]{8}T[0-9]{6}Z' /tmp/capture.log | head -1 | awk '{print $2}')
          git commit \
            -m "NFL vintage capture ${CID:-unknown}" \
            -m "Captured by GitHub Actions run ${GITHUB_RUN_ID}." \
            -m "Append-only: adds manifest rows and content-addressed blobs, rewrites nothing."
          # Rebase rather than force: a concurrent run's rows are evidence too.
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Report the standing gap
        if: always()
        run: |
          grep -A3 'UNMET CAPTURE TARGETS' /tmp/capture.log || \
            echo "no unmet-target line -- check the capture output"
