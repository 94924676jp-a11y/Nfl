name: agent-orchestrator-dispatch

# THE DEFAULT-BRANCH DISPATCHER. Deliberately small, deliberately boring.
#
# WHY IT HAS TO LIVE HERE. GitHub only starts a workflow from a
# `repository_dispatch` when the workflow definition exists on the
# repository's DEFAULT branch. The orchestrator implementation lives on the
# automation branch, so a dispatcher on `main` is the only thing that can
# receive the continuation event. Without this file the chain cannot
# self-sustain no matter how correct the orchestrator is -- it would run once
# and stop, silently.
#
# WHY IT MUST STAY SMALL. `repository_dispatch` executes the workflow
# definition FROM THE DEFAULT BRANCH. That makes this file the trust boundary
# of the whole autonomous system: whatever is written here runs with the
# repository's token. So it is treated as protected infrastructure --
# `coordination/orchestrator/contracts.py` lists `.github/workflows/` in
# PROTECTED_PATHS, and `locks.enforce_protected_paths` refuses any worker diff
# that touches it. An autonomous worker cannot edit this file. It should
# change rarely, by a human, and be easy to read in one sitting.
#
# WHAT IT DOES NOT DO. It does not decide anything, hold state, or read the
# queue. It validates the branch, checks out the automation branch, and runs
# the orchestrator from that checkout. Every fact the orchestrator acts on is
# re-read from that branch; nothing in the event payload is authoritative.
#
# WHERE THE AUTHORITY TO SPEND MONEY LIVES. Not here, and NOT in the payload.
# An earlier version let a human pick LIVE at startup and then downgraded
# every continuation to MOCK, because trusting the payload would let anyone
# who can open a dispatch spend money. The refusal was right; the location was
# wrong -- it also meant LIVE could never survive its own first continuation.
#
# LIVE now requires TWO fields in AUTOMATION_POLICY.json on the allowlisted
# automation branch: `autonomous_operation_enabled: true` AND
# `execution_mode: "LIVE"`. Both are on a protected path no worker may write.
# So the mode is resolved AFTER checkout, by reading that file -- which is why
# the steps below are ordered validate -> checkout -> resolve, and not the
# other way round. The payload is tracing only. The orchestrator then re-
# derives the same decision in-process before any provider call, so bypassing
# this workflow does not bypass the control.

on:
  repository_dispatch:
    types: [agent-orchestrator-continue]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Automation branch (must be on the allowlist below)'
        required: false
        default: 'claude/nfl-greenfield-architecture-stsxmk'
      mode:
        description: 'MOCK (free, fixtures) | PROOF (event-chain proof) | LIVE (requires the protected policy to authorize it)'
        required: false
        default: 'MOCK'
        type: choice
        options: [MOCK, PROOF, LIVE]

concurrency:
  group: agent-orchestrator-dispatch
  cancel-in-progress: false

permissions:
  contents: write
  # Required for GITHUB_TOKEN to POST /repos/{repo}/dispatches. Without it the
  # continuation is a 403 and the chain dies after one pass.
  actions: write
  issues: write

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ---------------------------------------------------------------- 1
      - name: Resolve and validate the automation branch
        id: target
        env:
          # Read through env rather than interpolated into the script body, so
          # a payload value is data to bash and never becomes shell syntax.
          REQUESTED: ${{ github.event.client_payload.branch || github.event.inputs.branch || 'claude/nfl-greenfield-architecture-stsxmk' }}
          REQUESTED_MODE: ${{ github.event.inputs.mode || 'MOCK' }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # THE ALLOWLIST. Exact strings, compared exactly. A dispatch payload
          # is attacker-influenced in the general case -- anyone who can open
          # a dispatch can name a branch -- so an arbitrary ref must never
          # reach `checkout`. Adding a branch here is a human edit to a
          # protected file on the default branch, which is the point.
          ALLOWED=( "claude/nfl-greenfield-architecture-stsxmk" )

          ok=0
          for b in "${ALLOWED[@]}"; do
            if [ "$REQUESTED" = "$b" ]; then ok=1; break; fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::BRANCH_NOT_ALLOWED: '$REQUESTED' is not on the allowlist."
            echo "Allowed: ${ALLOWED[*]}"
            echo "Refusing rather than checking out an arbitrary ref. A"
            echo "repository_dispatch payload is not a trusted source for"
            echo "deciding what code this workflow runs."
            exit 1
          fi

          # A PAYLOAD NEVER CARRIES A MODE. Not downgraded -- ignored. The
          # effective mode is resolved after checkout from the protected
          # policy, so there is nothing here for a payload to influence.
          if [ "$EVENT" = "repository_dispatch" ]; then
            REQ="CONTINUATION"
          else
            REQ="$REQUESTED_MODE"
            case "$REQ" in
              MOCK|PROOF|LIVE) ;;
              *) echo "::error::MODE_UNKNOWN: '$REQ'"; exit 1 ;;
            esac
          fi

          echo "branch=$REQUESTED"  >> "$GITHUB_OUTPUT"
          echo "requested=$REQ"     >> "$GITHUB_OUTPUT"
          echo "Branch     $REQUESTED  (allowlisted)"
          echo "Requested  $REQ  (a request, not an authorization)"
          echo "Trigger    $EVENT"

      # ---------------------------------------------------------------- 2
      - name: Checkout the automation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.branch }}
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Identify the committer
        run: |
          git config user.name  "agent-orchestrator"
          git config user.email "orchestrator@users.noreply.github.com"

      # ---------------------------------------------------------------- 3
      # Everything below reads the AUTOMATION BRANCH. The payload contributed
      # exactly one thing -- which allowlisted ref to check out -- and nothing
      # else it carried is consulted again.
      - name: Confirm the orchestrator is present on that branch
        run: |
          set -euo pipefail
          test -f coordination/orchestrator/main.py \
            || { echo "::error::orchestrator absent on this branch"; exit 1; }
          python3.12 -c "import urllib.request, json, hashlib; print('stdlib only: ok')"

      - name: Validate coordination state
        run: python3.12 coordination/validate_coordination.py

      # ---------------------------------------------------------------- 4
      # THE MODE DECISION, taken here and nowhere else, from the protected
      # policy file on the branch that was just checked out.
      - name: Resolve the execution mode from the protected policy
        id: mode
        env:
          REQUESTED: ${{ steps.target.outputs.requested }}
        run: |
          set -euo pipefail
          # Read the two protected fields. `python3.12 -c` rather than a
          # heredoc: a heredoc terminator cannot be indented, and indenting it
          # inside a YAML block is a silent syntax break waiting to happen.
          # An absent or unrecognised execution_mode reads as MOCK -- a
          # missing field must never be the permissive case.
          read -r ENABLED POLICY_MODE <<< "$(python3.12 -c 'import json; p=json.load(open("coordination/AUTOMATION_POLICY.json")); print("yes" if p.get("autonomous_operation_enabled") else "no", "LIVE" if str(p.get("execution_mode") or "MOCK").upper()=="LIVE" else "MOCK")')"
          # AN UNREADABLE POLICY IS A STOP, NOT A DEFAULT. `set -e` does not
          # fire on a failed command substitution inside `<<<`, so a missing
          # or malformed file would leave both variables EMPTY and fall
          # through the case below. Checked explicitly.
          case "$ENABLED:$POLICY_MODE" in
            yes:LIVE|yes:MOCK|no:LIVE|no:MOCK) ;;
            *) echo "::error::POLICY_UNREADABLE: could not read"
               echo "::error::autonomous_operation_enabled / execution_mode from"
               echo "::error::coordination/AUTOMATION_POLICY.json (got"
               echo "::error::'$ENABLED' / '$POLICY_MODE'). Refusing to guess."
               exit 1 ;;
          esac
          echo "policy: autonomous_operation_enabled=$ENABLED execution_mode=$POLICY_MODE"

          if [ "$ENABLED" != "yes" ]; then
            echo "::notice::Autonomy is disabled in the protected policy. The"
            echo "::notice::orchestrator will stop on its own; nothing is spent."
          fi

          case "$REQUESTED" in
            PROOF)
              # The event-chain proof never calls a provider, whatever the
              # policy says, so it is its own mode and cannot become LIVE.
              EFFECTIVE=MOCK; PROOF=1 ;;
            CONTINUATION)
              # A continuation inherits the POLICY, which is exactly what
              # makes an owner-armed LIVE survive without another human click.
              # BOTH fields are required: execution_mode=LIVE with autonomy
              # disabled is NOT live. The first cut of this line read the mode
              # alone and handed LIVE to a disabled system. The orchestrator's
              # in-process check would still have refused -- resolve_mode tests
              # the enable flag first -- so nothing would have been spent, but
              # two layers that disagree mean one of them is wrong, and it was
              # this one.
              if [ "$ENABLED" = "yes" ]; then
                EFFECTIVE="$POLICY_MODE"
              else
                EFFECTIVE=MOCK
              fi
              PROOF= ;;
            LIVE)
              if [ "$ENABLED" = "yes" ] && [ "$POLICY_MODE" = "LIVE" ]; then
                EFFECTIVE=LIVE
              else
                # REFUSE, rather than quietly running MOCK. An operator who
                # asked for LIVE and silently got MOCK finds out from a bill
                # that never arrives, which is the worst way to learn it.
                echo "::error::LIVE_NOT_AUTHORIZED: the protected policy says"
                echo "::error::autonomous_operation_enabled=$ENABLED and"
                echo "::error::execution_mode=$POLICY_MODE. Set BOTH"
                echo "::error::autonomous_operation_enabled=true and"
                echo "::error::execution_mode=LIVE in AUTOMATION_POLICY.json"
                echo "::error::on the automation branch, then re-run."
                exit 1
              fi
              PROOF= ;;
            *)
              EFFECTIVE=MOCK; PROOF= ;;
          esac

          echo "effective=$EFFECTIVE"     >> "$GITHUB_OUTPUT"
          echo "proof=$PROOF"             >> "$GITHUB_OUTPUT"
          echo "policy_mode=$POLICY_MODE" >> "$GITHUB_OUTPUT"
          echo "enabled=$ENABLED"         >> "$GITHUB_OUTPUT"
          echo "EFFECTIVE MODE: $EFFECTIVE  (proof=${PROOF:-no})"

      - name: Orchestrate
        env:
          AUTONOMY_MODE: ${{ steps.mode.outputs.effective }}
          PROOF_CHAIN: ${{ steps.mode.outputs.proof }}
          PROOF_PASS: ${{ github.event.client_payload.proof_pass || '1' }}
          PROOF_CHAIN_ID: ${{ github.event.client_payload.chain_id || '' }}
          AUTOMATION_BRANCH: ${{ steps.target.outputs.branch }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ORCHESTRATOR_PUSH: '1'
          ORCHESTRATOR_RUN_TESTS: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          set +e
          if [ -n "${PROOF_CHAIN:-}" ]; then
            # The event-chain proof. Runs a real orchestration pass against a
            # throwaway sandbox inside the runner, commits a proof ledger row
            # to the automation branch, and asks for the next pass. It never
            # touches the real queues and never calls a provider.
            python3.12 coordination/orchestrator/proof_chain.py
          else
            python3.12 coordination/orchestrator/main.py
          fi
          rc=$?
          echo "orchestrator exit=$rc"
          echo "ORCH_RC=$rc" >> "$GITHUB_ENV"
          # 2 is unreadable state and is a real build failure. An escalation
          # (4) or a clean stop (0/3) is a correct outcome that needs a human,
          # not a red build -- marking those red trains everyone to ignore red.
          if [ $rc -eq 2 ]; then exit 1; fi
          exit 0

      - name: Commit anything left uncommitted
        if: always()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "orchestrator: uncommitted state from run ${{ github.run_id }} [orchestrator-skip]" || true
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ steps.target.outputs.branch }}" \
                && git push origin "HEAD:${{ steps.target.outputs.branch }}" && break
              sleep $((2 ** i))
            done
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## agent-orchestrator-dispatch"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| trigger | \`${{ github.event_name }}\` |"
            echo "| branch | \`${{ steps.target.outputs.branch }}\` |"
            echo "| requested | \`${{ steps.target.outputs.requested }}\` |"
            echo "| policy enabled | \`${{ steps.mode.outputs.enabled }}\` |"
            echo "| policy execution_mode | \`${{ steps.mode.outputs.policy_mode }}\` |"
            echo "| **effective mode** | \`${{ steps.mode.outputs.effective }}\` |"
            echo "| chain depth | \`${{ github.event.client_payload.chain_depth || '0' }}\` |"
            echo "| proof pass | \`${{ github.event.client_payload.proof_pass || 'n/a' }}\` |"
            echo "| exit | \`${ORCH_RC:-n/a}\` |"
            echo ""
            echo "LIVE requires BOTH \`autonomous_operation_enabled: true\` and"
            echo "\`execution_mode: \\\"LIVE\\\"\` in \`coordination/AUTOMATION_POLICY.json\`"
            echo "on the automation branch. A dispatch payload cannot grant it."
            echo "Either field set back stops spending on the next pass."
          } >> "$GITHUB_STEP_SUMMARY"
