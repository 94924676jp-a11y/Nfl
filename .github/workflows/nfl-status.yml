name: NFL status anchored capture

# GENERATED FILE -- do not hand-edit.
#   nfl/tools/gen_status_schedule.py --season 2026 --week 4 --write
#   schedule identity: SCHEDNG-cef9f30a540faad6
#
# NON-G0A. This workflow serves ('practice', 'final_status') only. It CANNOT discharge the
# outstanding G0A `inactives` obligation, and that is enforced in
# nfl/capture/execution.py rather than by this comment: its runs classify as
# SCHEDULED_WINDOW_ANCHORED_NON_G0A, and BASIS_KINDS confines that basis to
# ('practice', 'final_status'). A run of this workflow inside the T-90 window, from an
# authorised source, records BASIS_NOT_AUTHORISED_FOR_KIND against inactives.
#
# The G0A path is .github/workflows/nfl-t90.yml, schedule identity
# SCHED-2a2924d4966fbd3d, and nothing here touches it.
#
# 5 distinct windows, 48 targets,
# 10 cron entries at an hourly step. These windows are 20 hours wide;
# the five-minute step used for the 80-minute inactives window would be 240
# entries each and would buy nothing.
#
# WHAT THIS DOES NOT CLAIM. GitHub may delay or drop a scheduled run. A capture
# discharges a target on evidence -- retrieved_at inside the window, an
# authorised source, a declared target, an anchored basis -- and never because
# this workflow fired.

on:
  schedule:
    # 2026-09-28 20:00Z -> 09-29 16:00Z  (1 target, practice)
    - cron: '0 20-23 28 9 *'
    - cron: '0 0-16 29 9 *'
    # 2026-09-29 20:00Z -> 09-30 16:00Z  (1 target, practice)
    - cron: '0 20-23 29 9 *'
    - cron: '0 0-16 30 9 *'
    # 2026-09-30 20:00Z -> 10-01 16:00Z  (16 targets, final_status/practice)
    - cron: '0 20-23 30 9 *'
    - cron: '0 0-16 1 10 *'
    # 2026-10-01 20:00Z -> 10-02 16:00Z  (15 targets, practice)
    - cron: '0 20-23 1 10 *'
    - cron: '0 0-16 2 10 *'
    # 2026-10-02 20:00Z -> 10-03 16:00Z  (15 targets, final_status)
    - cron: '0 20-23 2 10 *'
    - cron: '0 0-16 3 10 *'
  workflow_dispatch:

permissions:
  contents: write

env:
  CAPTURE_BRANCH: capture-prod

concurrency:
  group: nfl-vintage-capture      # shared with the baseline: never race it
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      # THE SURFACE IS capture-prod, THE DEFINITION LIVES ON THE DEFAULT BRANCH. Same split
      # as nfl-capture.yml: GitHub reads a `schedule:` definition from the default branch
      # only, and the code that runs and the bytes it writes belong to capture-prod. Until
      # 2026-10-02 this job checked out the default branch and pushed HEAD:main (D24-R2).
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CAPTURE_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # BELOW 3.12 THE ENGINE DOES NOT IMPORT, and two of the causes are at
      # AST level -- the module fails to parse before any import semantics or
      # any test can report on it. Asserted rather than assumed.
      - name: Assert the interpreter is 3.12 or later
        run: |
          python3 -c "import sys; assert sys.version_info >= (3,12), 'INTERPRETER_TOO_OLD: ' + sys.version; print('interpreter', sys.version.split()[0])"

      - name: Snapshot the vintage store before capture
        run: |
          python3 nfl/tools/check_retention.py --store vintage --snapshot-to /tmp/pre

      - name: Capture
        run: |
          set +e
          python3 nfl/tools/capture_vintage.py --season 2026 | tee /tmp/capture.log
          # ${PIPESTATUS[0]}, NOT $?. After a pipe $? is TEE's status, which
          # is 0 whatever the capture did.
          echo "capture_exit=${PIPESTATUS[0]}" | tee -a "$GITHUB_OUTPUT"

      # COMMIT BEFORE JUDGING. A failing step skips the rest of the job, so
      # with the FAIL gate first one misbehaving source discards every other
      # source's bytes for the run. Measured on the baseline workflow
      # 2026-09-08: runs 87 and 88 captured six sources and committed none.
      - name: Commit anything captured
        if: always()
        run: |
          git config user.name  "nfl-capture[bot]"
          git config user.email "nfl-capture@users.noreply.github.com"
          git add nfl/vintage nfl/vintage_manifest.jsonl
          if git diff --cached --quiet; then
            echo "nothing new captured; not committing"
            exit 0
          fi
          CID=$(grep -oE 'capture [0-9]{8}T[0-9]{6}Z' /tmp/capture.log | head -1 | awk '{print $2}')
          git commit \
            -m "NFL status anchored capture ${CID:-unknown}" \
            -m "GitHub Actions run ${GITHUB_RUN_ID}, NON-G0A anchored workflow." \
            -m "Append-only: adds manifest rows and content-addressed blobs."
          git pull --rebase --autostash origin "$CAPTURE_BRANCH"
          git push origin HEAD:"$CAPTURE_BRANCH"

      # THIS WORKFLOW NEVER HAD THE W3 GUARD AT ALL. It was added to
      # nfl-capture.yml and nfl-t90.yml on 2026-09-10 and this file was not
      # touched, so a status run could commit a blob, append no manifest row,
      # and report success -- the exact condition that lost 2026-09-09. Both
      # forms are here: the log predicate, and the filesystem comparison that
      # does not depend on a line of stdout having printed.
      - name: Assert the capture produced a manifest row
        if: always()
        run: |
          if grep -q 'Traceback (most recent call last)' /tmp/capture.log; then
            echo "CAPTURE_RAISED: the capture died with an unhandled exception"
            grep -A15 'Traceback (most recent call last)' /tmp/capture.log | tail -20
            exit 1
          fi
          if ! grep -qE '^manifest rows appended: [1-9]' /tmp/capture.log; then
            echo "CAPTURE_WROTE_NO_MANIFEST_ROW: no row was appended, so this"
            echo "run captured nothing that can discharge an obligation."
            tail -30 /tmp/capture.log
            exit 1
          fi
          grep -E '^manifest rows appended:' /tmp/capture.log

      - name: Assert no blob was written without a manifest row
        if: always()
        run: |
          python3 nfl/tools/check_retention.py --store vintage --gate delta \
            --before-blobs /tmp/pre.blobs --before-manifest /tmp/pre.manifest

      - name: Fail only on a real FAIL
        if: always()
        run: |
          # Runs AFTER the commit: the signal is kept, and so are the bytes.
          if grep -qE '^FAIL ' /tmp/capture.log; then
            grep -E '^FAIL ' /tmp/capture.log
            exit 1
          fi
          echo "no FAIL states"

      - name: Report game-level coverage
        if: always()
        run: |
          grep -A6 'GAME-LEVEL COVERAGE' /tmp/capture.log || \
            echo "no coverage line -- check the capture output"
