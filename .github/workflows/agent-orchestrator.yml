name: agent-orchestrator

# The autonomous runtime's clock. Every commit the orchestrator makes is an
# event, and the event starts the next pass -- so the state machine advances
# across many short runs rather than inside one long one.
#
# THE RECURSION IS DELIBERATE AND IT IS FENCED FOUR WAYS:
#
#   1. `paths:` limits the push trigger to coordination state. A code commit
#      does not wake the orchestrator.
#   2. `concurrency` allows ONE orchestrator per branch. A second is queued,
#      not run beside the first.
#   3. The job exits unless AUTOMATION_POLICY.json says
#      autonomous_operation_enabled -- the kill switch is a committed file,
#      not a workflow setting, so turning it off is a one-line PR anyone can
#      review.
#   4. `max_transitions_per_invocation` caps what one pass may do, and
#      max_runs_per_hour is counted from the committed handoff log, so two
#      runners see the same number.
#
# The belt-and-braces matter because three of the four are things a person can
# change by accident. The fourth -- the committed policy file -- is the one
# that is hard to disable without noticing.

on:
  push:
    branches: [claude/nfl-greenfield-architecture-stsxmk]
    paths:
      - 'coordination/ENGINEERING_QUEUE.json'
      - 'coordination/RESEARCH_QUEUE.json'
      - 'coordination/CLAUDE_RETURNS/**'
      - 'coordination/PERPLEXITY_RETURNS/**'
      - 'coordination/CHATGPT_OUTBOX/**'
      - 'coordination/AUTOMATION_POLICY.json'
  workflow_dispatch:
    inputs:
      mode:
        description: 'MOCK (default, free) or LIVE (spends real API calls)'
        required: false
        default: 'MOCK'
        type: choice
        options: [MOCK, LIVE]
      max_transitions:
        description: 'Override the per-invocation transition cap'
        required: false
        default: ''
      plan_only:
        description: 'Decide and print; execute nothing'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# ONE ORCHESTRATOR PER BRANCH. `cancel-in-progress: false` on purpose: a pass
# that is mid-commit must finish, because cancelling it could leave a worker's
# files written and its queue transition unrecorded. Queueing costs latency;
# cancelling costs consistency.
concurrency:
  group: agent-orchestrator-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    # A commit made BY the orchestrator must not immediately re-trigger a pass
    # inside the same run; the push event it generates does that, once.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[orchestrator-skip]')
    timeout-minutes: 45

    steps:
      - name: Checkout with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # NO `pip install`. The runtime talks to all three providers over
      # urllib from the standard library. Three fewer packages is three fewer
      # supply-chain surfaces and one fewer step that can fail before the
      # queue has even been read.
      - name: Confirm no third-party dependency is needed
        run: |
          python3.12 -c "import urllib.request, json, hashlib; print('stdlib only: ok')"

      - name: Identify the committer
        run: |
          git config user.name  "agent-orchestrator"
          git config user.email "orchestrator@users.noreply.github.com"

      # VALIDATE BEFORE ANYTHING ELSE. A contradictory queue stops the run
      # here, before a single token is spent reasoning about it.
      - name: Validate coordination state
        run: python3.12 coordination/validate_coordination.py

      - name: Prove the state machine on mocks
        run: python3.12 nfl/tests/run_suite.py --only test_orchestrator

      - name: Report the plan
        run: python3.12 coordination/orchestrator/main.py --plan

      - name: Orchestrate
        if: ${{ github.event.inputs.plan_only != 'true' }}
        env:
          AUTONOMY_MODE: ${{ github.event.inputs.mode || 'MOCK' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ORCHESTRATOR_PUSH: '1'
          ORCHESTRATOR_RUN_TESTS: '1'
        run: |
          set +e
          if [ -n "${{ github.event.inputs.max_transitions }}" ]; then
            python3.12 coordination/orchestrator/main.py \
              --max "${{ github.event.inputs.max_transitions }}"
          else
            python3.12 coordination/orchestrator/main.py
          fi
          rc=$?
          echo "orchestrator exit=$rc"
          # 0 clean stop, 3 nothing to do, 4 escalation, 2 unreadable state,
          # 5 worker failure. Only 2 fails the job: an escalation is a correct
          # outcome that needs a human, not a broken build, and marking it red
          # would train everyone to ignore red.
          if [ $rc -eq 2 ]; then exit 1; fi
          echo "ORCH_RC=$rc" >> "$GITHUB_ENV"
          exit 0

      # The orchestrator pushes its own commits. This is the safety net for a
      # pass that wrote files and then hit a refusal before committing --
      # without it those files would vanish with the runner and the next pass
      # would re-derive from a state that never recorded them.
      - name: Commit anything the orchestrator left uncommitted
        if: always()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "orchestrator: uncommitted state from run ${{ github.run_id }} [orchestrator-skip]" \
              -m "Left behind by a pass that stopped before committing. Recorded rather than discarded." || true
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" && \
                git push origin "${{ github.ref_name }}" && break
              sleep $((2 ** i))
            done
          else
            echo "working tree clean"
          fi

      - name: Raise an issue if the loop escalated
        if: always() && env.ORCH_RC == '4'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dir = 'coordination/ESCALATIONS';
            if (!fs.existsSync(dir)) return;
            const files = fs.readdirSync(dir).sort().reverse().slice(0, 1);
            for (const f of files) {
              const body = fs.readFileSync(`${dir}/${f}`, 'utf8');
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Owner decision needed: ${f.replace(/\.md$/, '')}`,
                labels: ['owner-escalation'],
                body: body + `\n\n---\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nThe loop stopped and will not retry on its own.`,
              });
            }

      - name: Summary
        if: always()
        run: |
          {
            echo "## Orchestrator"
            echo ""
            echo "- mode: \`${{ github.event.inputs.mode || 'MOCK' }}\`"
            echo "- exit: \`${ORCH_RC:-n/a}\`"
            echo "- head: \`$(git rev-parse --short HEAD)\`"
            echo ""
            echo "Autonomy is armed in \`coordination/AUTOMATION_POLICY.json\`."
            echo "To stop it immediately, set \`autonomous_operation_enabled\` to false and push."
          } >> "$GITHUB_STEP_SUMMARY"
