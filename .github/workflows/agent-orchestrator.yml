name: agent-orchestrator

# The autonomous runtime's clock.
#
# CONTINUATION IS AN EXPLICIT repository_dispatch, NOT PUSH RECURSION.
#
# An earlier version of this workflow assumed the loop would sustain itself:
# orchestrator commits -> git push -> push event -> next run. It would not
# have. GitHub documents that "when you use the repository's GITHUB_TOKEN to
# perform tasks, events triggered by the GITHUB_TOKEN will not create a new
# workflow run" -- precisely so a workflow that pushes cannot recurse. The
# chain would have run once and stopped, silently, looking healthy.
#
# The same documentation names the two exceptions: workflow_dispatch and
# repository_dispatch "always create workflow runs", because they are explicit
# calls rather than side effects. So the orchestrator ASKS for the next pass,
# and only when it has decided more work is eligible. That is better than the
# accident it replaces -- continuation now has a budget, a log row and a
# reason attached to it.
#
# The push trigger below is KEPT, but only for what it can actually do: wake
# the orchestrator when a HUMAN pushes coordination state. A human push is not
# a GITHUB_TOKEN push, so it does start a run.
#
# THE CHAIN IS FENCED SIX WAYS, and no single one is trusted:
#
#   1. `concurrency` allows ONE orchestrator per branch.
#   2. The job exits unless AUTOMATION_POLICY.json says
#      autonomous_operation_enabled -- the kill switch is a committed file,
#      not a workflow setting.
#   3. `max_transitions_per_invocation` caps what one pass may do.
#   4. `max_continuations_per_hour` caps the dispatch chain, counted from the
#      committed handoff log -- NOT from the payload, because the payload's
#      sender is the thing being bounded.
#   5. `max_runs_per_hour` caps every pass however it started.
#   6. A pass that committed nothing, or whose worker failed, does not chain.
#
# The payload carries branch, run id, observed head, depth and a reason. It
# carries NO project state. The next pass re-reads everything from the
# repository and trusts nothing that arrived with the event.

# CONTINUATION IS RECEIVED ON THE DEFAULT BRANCH, NOT HERE.
#
# `repository_dispatch` was listed here and it could never have fired: GitHub
# starts a workflow from a repository_dispatch only when the workflow
# DEFINITION EXISTS ON THE DEFAULT BRANCH, and this file lives on the
# automation branch. Leaving the trigger in place would have been a claim the
# repository could not honour -- the second assumption in a row that looked
# right in every test that never crossed a workflow boundary.
#
# The continuation is received by `.github/workflows/agent-orchestrator-
# dispatch.yml` on `main`, which validates the branch against an allowlist,
# checks this branch out, and runs the orchestrator from that checkout. This
# workflow remains for direct runs on the automation branch: a human push of
# coordination state, or a manual Run workflow.
on:
  push:
    branches: [claude/nfl-greenfield-architecture-stsxmk]
    paths:
      - 'coordination/ENGINEERING_QUEUE.json'
      - 'coordination/RESEARCH_QUEUE.json'
      - 'coordination/CLAUDE_RETURNS/**'
      - 'coordination/PERPLEXITY_RETURNS/**'
      - 'coordination/CHATGPT_OUTBOX/**'
      - 'coordination/AUTOMATION_POLICY.json'
  workflow_dispatch:
    inputs:
      mode:
        description: 'MOCK (default, free) or LIVE (spends real API calls)'
        required: false
        default: 'MOCK'
        type: choice
        options: [MOCK, LIVE]
      max_transitions:
        description: 'Override the per-invocation transition cap'
        required: false
        default: ''
      plan_only:
        description: 'Decide and print; execute nothing'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# ONE ORCHESTRATOR PER BRANCH. `cancel-in-progress: false` on purpose: a pass
# that is mid-commit must finish, because cancelling it could leave a worker's
# files written and its queue transition unrecorded. Queueing costs latency;
# cancelling costs consistency.
concurrency:
  group: agent-orchestrator-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # REQUIRED FOR THE CONTINUATION, and easy to miss: creating a
  # repository_dispatch with GITHUB_TOKEN needs write on top of contents.
  # Without it the POST returns 403 and the chain stops after one pass -- the
  # exact failure this workflow was rewritten to remove. request_continuation
  # names this remedy in its own 403 message.
  actions: write
  issues: write

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    # A commit made BY the orchestrator must not immediately re-trigger a pass
    # inside the same run; the push event it generates does that, once.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      !contains(github.event.head_commit.message, '[orchestrator-skip]')
    timeout-minutes: 45

    steps:
      - name: Checkout with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A repository_dispatch run checks out the default branch unless
          # told otherwise, so the continuation's branch is used when present.
          # The payload is trusted for THIS and nothing else -- it selects
          # which ref to read, and every fact still comes from the ref.
          ref: ${{ github.event.client_payload.branch || github.ref_name }}

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # NO `pip install`. The runtime talks to all three providers over
      # urllib from the standard library. Three fewer packages is three fewer
      # supply-chain surfaces and one fewer step that can fail before the
      # queue has even been read.
      - name: Confirm no third-party dependency is needed
        run: |
          python3.12 -c "import urllib.request, json, hashlib; print('stdlib only: ok')"

      - name: Identify the committer
        run: |
          git config user.name  "agent-orchestrator"
          git config user.email "orchestrator@users.noreply.github.com"

      # VALIDATE BEFORE ANYTHING ELSE. A contradictory queue stops the run
      # here, before a single token is spent reasoning about it.
      - name: Validate coordination state
        run: python3.12 coordination/validate_coordination.py

      - name: Prove the state machine on mocks
        run: python3.12 nfl/tests/run_suite.py --only test_orchestrator

      - name: Report the plan
        run: python3.12 coordination/orchestrator/main.py --plan

      - name: Orchestrate
        if: ${{ github.event.inputs.plan_only != 'true' }}
        env:
          AUTONOMY_MODE: ${{ github.event.inputs.mode || 'MOCK' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ORCHESTRATOR_PUSH: '1'
          ORCHESTRATOR_RUN_TESTS: '1'
          # Used by request_continuation to POST /repos/{repo}/dispatches.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          if [ -n "${{ github.event.inputs.max_transitions }}" ]; then
            python3.12 coordination/orchestrator/main.py \
              --max "${{ github.event.inputs.max_transitions }}"
          else
            python3.12 coordination/orchestrator/main.py
          fi
          rc=$?
          echo "orchestrator exit=$rc"
          # 0 clean stop, 3 nothing to do, 4 escalation, 2 unreadable state,
          # 5 worker failure. Only 2 fails the job: an escalation is a correct
          # outcome that needs a human, not a broken build, and marking it red
          # would train everyone to ignore red.
          if [ $rc -eq 2 ]; then exit 1; fi
          echo "ORCH_RC=$rc" >> "$GITHUB_ENV"
          exit 0

      # The orchestrator pushes its own commits. This is the safety net for a
      # pass that wrote files and then hit a refusal before committing --
      # without it those files would vanish with the runner and the next pass
      # would re-derive from a state that never recorded them.
      - name: Commit anything the orchestrator left uncommitted
        if: always()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "orchestrator: uncommitted state from run ${{ github.run_id }} [orchestrator-skip]" \
              -m "Left behind by a pass that stopped before committing. Recorded rather than discarded." || true
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" && \
                git push origin "${{ github.ref_name }}" && break
              sleep $((2 ** i))
            done
          else
            echo "working tree clean"
          fi

      - name: Raise an issue if the loop escalated
        if: always() && env.ORCH_RC == '4'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dir = 'coordination/ESCALATIONS';
            if (!fs.existsSync(dir)) return;
            const files = fs.readdirSync(dir).sort().reverse().slice(0, 1);
            for (const f of files) {
              const body = fs.readFileSync(`${dir}/${f}`, 'utf8');
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Owner decision needed: ${f.replace(/\.md$/, '')}`,
                labels: ['owner-escalation'],
                body: body + `\n\n---\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nThe loop stopped and will not retry on its own.`,
              });
            }

      - name: Summary
        if: always()
        run: |
          {
            echo "## Orchestrator"
            echo ""
            echo "- trigger: \`${{ github.event_name }}\`"
            echo "- chain depth: \`${{ github.event.client_payload.chain_depth || '0' }}\`"
            echo "- mode: \`${{ github.event.inputs.mode || 'MOCK' }}\`"
            echo "- exit: \`${ORCH_RC:-n/a}\`"
            echo "- head: \`$(git rev-parse --short HEAD)\`"
            echo ""
            echo "Autonomy is armed in \`coordination/AUTOMATION_POLICY.json\`."
            echo "To stop it immediately, set \`autonomous_operation_enabled\` to false and push."
          } >> "$GITHUB_STEP_SUMMARY"
