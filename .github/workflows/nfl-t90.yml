name: NFL T-90 anchored capture

# GENERATED FILE -- do not hand-edit.
#   nfl/tools/gen_t90_schedule.py --season 2026 --week 1 --write
#   schedule identity: SCHED-2a2924d4966fbd3d
#
# That identity is a digest over the (game, window) pairs themselves, not over
# the snapshot file they were read from. A re-captured schedule with unchanged
# kickoffs leaves it unchanged; a moved kickoff changes it and the drift test
# in nfl/tests/test_t90_workflow.py fails.
#
# Every cron entry below exists because a kickoff time in that snapshot put a
# capture window there. None is a round-number cadence. That is what makes this
# event-anchored and the `*/30` baseline in nfl-capture.yml not.
#
# 6 distinct windows, 16 games, 16 cron entries, 5-minute step inside each window.
#
# WHAT THIS DOES NOT CLAIM. GitHub may delay or drop a scheduled run; no cron
# arrangement prevents that. This raises the chances inside an 80-minute window
# from about two to about sixteen. It does not promise any of them.
#
# A capture discharges a target on evidence -- retrieved_at inside the window,
# an authorised source, attributed to the game -- and never because this
# workflow fired rather than the baseline one.

on:
  schedule:
    # 2026-09-09 22:50Z -> 00:10Z  (1 game: 2026_01_NE_SEA)
    - cron: '50,55 22 9 9 *'
    - cron: '*/5 23 9 9 *'
    - cron: '0,5,10 0 10 9 *'
    # 2026-09-10 23:05Z -> 00:25Z  (1 game: 2026_01_SF_LA)
    - cron: '5,10,15,20,25,30,35,40,45,50,55 23 10 9 *'
    - cron: '0,5,10,15,20,25 0 11 9 *'
    # 2026-09-13 15:30Z -> 16:50Z  (8 games: 2026_01_ATL_PIT, 2026_01_BAL_IND, 2026_01_BUF_HOU, 2026_01_CHI_CAR, 2026_01_CLE_JAX, 2026_01_NO_DET, 2026_01_NYJ_TEN, 2026_01_TB_CIN)
    - cron: '30,35,40,45,50,55 15 13 9 *'
    - cron: '0,5,10,15,20,25,30,35,40,45,50 16 13 9 *'
    # 2026-09-13 18:55Z -> 20:15Z  (4 games: 2026_01_ARI_LAC, 2026_01_GB_MIN, 2026_01_MIA_LV, 2026_01_WAS_PHI)
    - cron: '55 18 13 9 *'
    - cron: '*/5 19 13 9 *'
    - cron: '0,5,10,15 20 13 9 *'
    # 2026-09-13 22:50Z -> 00:10Z  (1 game: 2026_01_DAL_NYG)
    - cron: '50,55 22 13 9 *'
    - cron: '*/5 23 13 9 *'
    - cron: '0,5,10 0 14 9 *'
    # 2026-09-14 22:45Z -> 00:05Z  (1 game: 2026_01_DEN_KC)
    - cron: '45,50,55 22 14 9 *'
    - cron: '*/5 23 14 9 *'
    - cron: '0,5 0 15 9 *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfl-vintage-capture      # shared with the baseline: never race it
  cancel-in-progress: false

# ONE DECLARATION OF THE PRODUCTION CAPTURE BRANCH, read by both the checkout
# ref and the write-back target. Naming it twice is how they came to disagree:
# the first D24 pin set the ref to capture-prod and left the push at HEAD:main,
# which would have rebased the capture tree onto main and pushed it there.
env:
  CAPTURE_BRANCH: capture-prod

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      # THIS DEFINITION IS READ FROM THE DEFAULT BRANCH. GitHub takes a
      # `schedule:` workflow definition from the default branch only, so this
      # file must live there -- while the capture SURFACE it runs lives on
      # capture-prod. A bare checkout took the DEFAULT branch, which on
      # 2026-09-15 was missing three capture modules outright, so D20's
      # row_container, D22's payload contracts and D24's persisted-digest guard
      # were all absent from the only code that actually captures.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CAPTURE_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # BELOW 3.12 THE ENGINE DOES NOT IMPORT, and two of the causes are at AST
      # level -- the module fails to parse before any import semantics or any
      # test can report on it. Asserted rather than assumed.
      - name: Assert the interpreter is 3.12 or later
        run: |
          python3 -c "import sys; assert sys.version_info >= (3,12), 'INTERPRETER_TOO_OLD: ' + sys.version; print('interpreter', sys.version.split()[0])"

      # A MUTABLE BRANCH NAME IS NOT PROVENANCE. `ref:` says which branch; it
      # does not say which commit ran, and this job commits its own captured
      # bytes back to that branch, so the tip moves every successful run.
      - name: Record the resolved capture commit
        id: capref
        run: |
          SHA=$(git rev-parse HEAD)
          echo "executed_sha=$SHA" | tee -a "$GITHUB_OUTPUT"
          echo "branch=$(git rev-parse --abbrev-ref HEAD)" | tee -a "$GITHUB_OUTPUT"

      # FAIL CLOSED BEFORE ANY BYTES ARE FETCHED. The identity checked is the
      # SURFACE DIGEST, not the branch tip: a tip-keyed check would pass the
      # first capture and refuse every capture after it, because the capture
      # itself moves the tip.
      - name: Assert this executor is the approved capture release
        run: |
          python3 nfl/tools/capture_release.py --check-executor \
            --executed-sha "${{ steps.capref.outputs.executed_sha }}"

      # The before-state for the blob/manifest invariant, taken before any
      # bytes are fetched so the post-capture check compares two real
      # observations rather than the store against itself.
      - name: Snapshot the vintage store before capture
        run: |
          python3 nfl/tools/check_retention.py --store vintage --snapshot-to /tmp/pre

      - name: Capture
        run: |
          set +e
          python3 nfl/tools/capture_vintage.py --season 2026 | tee /tmp/capture.log
          # ${PIPESTATUS[0]}, NOT $?. After a pipe $? is tee's status, which
          # is 0 whatever the capture did, so the capture's own exit code was
          # never recorded at all.
          echo "capture_exit=${PIPESTATUS[0]}" | tee -a "$GITHUB_OUTPUT"

      # COMMIT BEFORE JUDGING, and here it matters most. A failing step skips
      # the rest of the job, so with the FAIL gate first a single misbehaving
      # source inside the T-90 window would have thrown away the qualifying
      # inactives capture this workflow exists to take. Measured on the
      # baseline workflow 2026-09-08: runs 87 and 88 captured six sources and
      # committed none. The window is 80 minutes and does not come back.
      - name: Commit anything captured
        if: always()
        run: |
          git config user.name  "nfl-capture[bot]"
          git config user.email "nfl-capture@users.noreply.github.com"
          git add nfl/vintage nfl/vintage_manifest.jsonl
          if git diff --cached --quiet; then
            echo "nothing new captured; not committing"
            exit 0
          fi
          CID=$(grep -oE 'capture [0-9]{8}T[0-9]{6}Z' /tmp/capture.log | head -1 | awk '{print $2}')
          git commit \
            -m "NFL T-90 anchored capture ${CID:-unknown}" \
            -m "GitHub Actions run ${GITHUB_RUN_ID}, T-90 anchored workflow." \
            -m "Append-only: adds manifest rows and content-addressed blobs."
          git pull --rebase --autostash origin "$CAPTURE_BRANCH"
          git push origin HEAD:"$CAPTURE_BRANCH"

      # A GREEN RUN THAT CAPTURED NOTHING DISCHARGEABLE IS THE FAILURE MODE
      # THIS GATE EXISTS TO END. On 2026-09-09/10 the capture runs put
      # schedules blobs into nfl/vintage, appended NO manifest row, printed a
      # commit message reading "capture unknown" because the summary line never
      # printed, and reported success. The NE@SEA T-90 window then closed with
      # qualifying_captures = 0. Durable bytes with no manifest row are
      # orphans: nothing attributes them to a game, a window or a basis, so
      # they can discharge nothing.
      #
      # Runs AFTER the commit, so the bytes and the signal are both kept.
      - name: Assert the capture produced a manifest row
        if: always()
        run: |
          if grep -q 'Traceback (most recent call last)' /tmp/capture.log; then
            echo "CAPTURE_RAISED: the capture died with an unhandled exception"
            grep -A15 'Traceback (most recent call last)' /tmp/capture.log | tail -20
            exit 1
          fi
          if ! grep -qE '^manifest rows appended: [1-9]' /tmp/capture.log; then
            echo "CAPTURE_WROTE_NO_MANIFEST_ROW: no row was appended, so this"
            echo "run captured nothing that can discharge an obligation."
            tail -30 /tmp/capture.log
            exit 1
          fi
          grep -E '^manifest rows appended:' /tmp/capture.log

      # THE SAME GUARD AS THE LINE ABOVE, OFF THE LOG STRING AND ONTO THE
      # FILESYSTEM. The 50 runs that lost 2026-09-08/09/10 printed no summary
      # line at all, which is exactly when a stdout guard can see least. This
      # compares the blob set and the manifest before and after, and refuses a
      # run that added durable bytes with no row naming them. Runs AFTER the
      # commit: the bytes are kept and so is the signal.
      - name: Assert no blob was written without a manifest row
        if: always()
        run: |
          python3 nfl/tools/check_retention.py --store vintage --gate delta \
            --before-blobs /tmp/pre.blobs --before-manifest /tmp/pre.manifest

      - name: Fail only on a real FAIL
        if: always()
        run: |
          # Runs AFTER the commit: the signal is kept, and so are the bytes.
          if grep -qE '^FAIL ' /tmp/capture.log; then
            grep -E '^FAIL ' /tmp/capture.log
            exit 1
          fi
          echo "no FAIL states"

      - name: Report game-level coverage
        if: always()
        run: |
          grep -A6 'GAME-LEVEL COVERAGE' /tmp/capture.log || \
            echo "no coverage line -- check the capture output"
